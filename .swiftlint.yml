included:
  - Sources
  - Tests

excluded:
  - .build
  - .cache
  - dist
  - site
  - wiki
  - docs

line_length:
  warning: 160
  error: 240
  ignores_urls: true
  ignores_function_declarations: true
  ignores_interpolated_strings: true

file_length:
  warning: 1600
  error: 2400

type_body_length:
  warning: 900
  error: 1500

function_body_length:
  warning: 200
  error: 320

cyclomatic_complexity:
  warning: 30
  error: 50

identifier_name:
  min_length: 1
  max_length: 60

type_name:
  min_length: 2
  max_length: 60

disabled_rules:
  - todo
  - trailing_comma
  - nesting
  - function_parameter_count
  - multiple_closures_with_trailing_closure
  - large_tuple
  - notification_center_detachment

opt_in_rules:
  - contains_over_first_not_nil
  - empty_count
  - explicit_init
  - first_where
  - implicit_return
  - sorted_first_last
  - vertical_whitespace_closing_braces
  - yoda_condition

empty_count:
  severity: warning
