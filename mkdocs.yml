site_name: DiskScope
site_description: Нативный анализатор диска для macOS — тепловая карта, крупнейшие файлы, типы и очистка в Корзину.
site_author: DiskScope
site_url: !ENV [MKDOCS_SITE_URL, "https://fso13.github.io/DiskScope/"]

repo_url: !ENV [MKDOCS_REPO_URL, "https://github.com/fso13/DiskScope"]
repo_name: !ENV [MKDOCS_REPO_NAME, "fso13/DiskScope"]
edit_uri: !ENV [MKDOCS_EDIT_URI, "edit/main/docs/"]

docs_dir: docs
site_dir: site
use_directory_urls: false

copyright: "© 2026 DiskScope · built with Swift & APFS"

theme:
  name: material
  language: ru
  logo: assets/icon.png
  favicon: assets/icon.png
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Тёмная тема
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - assets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fso13/DiskScope
      name: DiskScope на GitHub

nav:
  - Обзор: index.md
  - Скачать: https://github.com/fso13/DiskScope/releases/latest
  - Как пользоваться: usage.md
  - CLI: cli.md
  - Автоматизация: automation.md
  - Доступность: accessibility.md
  - Меню-бар: menu-bar.md
  - Кэш дерева: scan-cache.md
  - Параллельный обход: parallel-scan.md
  - Бюджеты папок: folder-budgets.md
  - Заброшенные файлы: stale-files.md
  - Правила очистки: cleanup-rules.md
  - Сборка и тесты: build.md
  - Архитектура: architecture.md
  - CI и релизы: release.md
  - Распространение: distribution.md
  - Ограничения: limitations.md
  - Roadmap: https://github.com/fso13/DiskScope/blob/main/ROADMAP.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
