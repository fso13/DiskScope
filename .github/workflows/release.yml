name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, build and publish
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Import Developer ID certificate
        if: ${{ secrets.MACOS_CERTIFICATE != '' }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "error: Developer ID Application identity not found" >&2
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Run tests
        run: swift test

      - name: Build universal app
        env:
          UNIVERSAL: '1'
          BUILD_NUMBER: ${{ github.run_number }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION
          ./build.sh

          ARCHIVE_NAME="DiskScope-${VERSION}-macos-universal.zip"
          STABLE_ZIP="DiskScope-macos-universal.zip"
          DMG_NAME="DiskScope-${VERSION}-macos-universal.dmg"
          STABLE_DMG="DiskScope-macos-universal.dmg"

          mv dist/DiskScope.zip "dist/${ARCHIVE_NAME}"
          cp "dist/${ARCHIVE_NAME}" "dist/${STABLE_ZIP}"
          mv dist/DiskScope.dmg "dist/${DMG_NAME}"
          cp "dist/${DMG_NAME}" "dist/${STABLE_DMG}"

          (cd dist && shasum -a 256 "${STABLE_DMG}" "${STABLE_ZIP}" > SHA256SUMS.txt)
          DMG_HASH="$(awk 'NR==1 {print $1}' dist/SHA256SUMS.txt)"
          ZIP_HASH="$(awk 'NR==2 {print $1}' dist/SHA256SUMS.txt)"

          {
            echo "VERSION=${VERSION}"
            echo "ARCHIVE_NAME=${ARCHIVE_NAME}"
            echo "STABLE_ZIP=${STABLE_ZIP}"
            echo "DMG_NAME=${DMG_NAME}"
            echo "STABLE_DMG=${STABLE_DMG}"
            echo "DMG_SHA256=${DMG_HASH}"
            echo "ZIP_SHA256=${ZIP_HASH}"
          } >> "$GITHUB_ENV"

      - name: Verify bundle
        run: |
          set -euo pipefail
          codesign --verify --deep --strict dist/DiskScope.app
          lipo -info dist/DiskScope.app/Contents/MacOS/DiskScope
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" dist/DiskScope.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" dist/DiskScope.app/Contents/Info.plist
          test -f "dist/${ARCHIVE_NAME}"
          test -f "dist/${STABLE_ZIP}"
          test -f "dist/${DMG_NAME}"
          test -f "dist/${STABLE_DMG}"
          test -f dist/SHA256SUMS.txt
          hdiutil verify "dist/${STABLE_DMG}" >/dev/null

          MOUNT="$(hdiutil attach -nobrowse -readonly "dist/${STABLE_DMG}" | tail -1 | awk -F'\t' '{print $NF}')"
          test -d "$MOUNT/DiskScope.app"
          test -L "$MOUNT/Applications"
          codesign --verify --deep --strict "$MOUNT/DiskScope.app"
          hdiutil detach "$MOUNT" >/dev/null

      - name: Notarize app and DMG
        if: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          ./scripts/notarize.sh dist/DiskScope.app dist/DiskScope.dmg
          ditto -c -k --keepParent dist/DiskScope.app "dist/${ARCHIVE_NAME}"
          cp "dist/${ARCHIVE_NAME}" "dist/${STABLE_ZIP}"
          (cd dist && shasum -a 256 "${STABLE_DMG}" "${STABLE_ZIP}" > SHA256SUMS.txt)
          echo "DMG_SHA256=$(awk 'NR==1 {print $1}' dist/SHA256SUMS.txt)" >> "$GITHUB_ENV"
          echo "ZIP_SHA256=$(awk 'NR==2 {print $1}' dist/SHA256SUMS.txt)" >> "$GITHUB_ENV"

      - name: Generate Sparkle appcast
        if: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          TOOL=".build/artifacts/sparkle/Sparkle/bin/generate_keys"
          echo "$SPARKLE_PRIVATE_KEY" | base64 --decode > "$RUNNER_TEMP/sparkle.key"
          "$TOOL" -f "$RUNNER_TEMP/sparkle.key"
          rm -f "$RUNNER_TEMP/sparkle.key"
          ./scripts/generate-appcast.sh dist

      - name: Update Homebrew cask
        run: |
          set -euo pipefail
          VERSION="$VERSION" SHA256="$DMG_SHA256" ./scripts/update-cask.sh
          cp Casks/diskscope.rb dist/diskscope.rb

      - name: Create release notes
        run: |
          set -euo pipefail
          RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          DMG_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${STABLE_DMG}"
          ZIP_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${STABLE_ZIP}"
          CHANGELOG_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md"

          ./scripts/release-notes.sh "${GITHUB_REF_NAME}" > release-notes.md
          {
            echo
            echo "## Скачать"
            echo
            echo "**DMG:** [${STABLE_DMG}](${DMG_URL})"
            echo
            echo "**ZIP:** [${STABLE_ZIP}](${ZIP_URL})"
            echo
            echo "**Страница релиза:** ${RELEASE_URL}"
            echo
            echo "## Установка"
            echo
            echo "1. Скачайте \`${STABLE_DMG}\` и откройте образ."
            echo "2. Перетащите \`DiskScope.app\` в «Программы»."
            echo "3. Запустите DiskScope из «Программ»."
            echo "4. Если macOS не даёт открыть приложение, используйте контекстное меню → «Открыть»."
            echo "5. Для полного сканирования выдайте «Полный доступ к диску» и перезапустите DiskScope."
            echo
            echo "ZIP-архив \`${STABLE_ZIP}\` — альтернатива для тех, кто предпочитает архив."
            echo
            echo "Homebrew: \`brew install --cask fso13/diskscope/diskscope\`"
            echo
            echo "Образ собран universal: Apple Silicon и Intel (macOS 14+)."
            echo
            echo "**Все изменения:** [CHANGELOG.md](${CHANGELOG_URL})"
            echo
            echo "**SHA-256 DMG:** \`${DMG_SHA256}\`"
            echo
            echo "**SHA-256 ZIP:** \`${ZIP_SHA256}\`"
            echo
            echo "Постоянная ссылка: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/latest/download/${STABLE_DMG}"
          } >> release-notes.md
          echo "----- release notes -----"
          cat release-notes.md

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskScope-${{ github.ref_name }}
          path: |
            dist/DiskScope-*.dmg
            dist/DiskScope-*.zip
            dist/SHA256SUMS.txt
            dist/appcast.xml
            dist/diskscope.rb
            release-notes.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="DiskScope ${GITHUB_REF_NAME}"
          EXTRA_ASSETS=()
          if [ -f dist/appcast.xml ]; then EXTRA_ASSETS+=(dist/appcast.xml); fi
          if [ -f dist/diskscope.rb ]; then EXTRA_ASSETS+=(dist/diskscope.rb); fi
          PRERELEASE_FLAG=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "$TITLE" \
              --notes-file release-notes.md
            EXTRA_ASSETS=()
            if [ -f dist/appcast.xml ]; then EXTRA_ASSETS+=(dist/appcast.xml); fi
            if [ -f dist/diskscope.rb ]; then EXTRA_ASSETS+=(dist/diskscope.rb); fi
            gh release upload "${GITHUB_REF_NAME}" \
              "dist/${STABLE_DMG}" \
              "dist/${STABLE_ZIP}" \
              "dist/${DMG_NAME}" \
              "dist/${ARCHIVE_NAME}" \
              dist/SHA256SUMS.txt \
              "${EXTRA_ASSETS[@]}" \
              --clobber
            if [[ -n "$PRERELEASE_FLAG" ]]; then
              gh release edit "${GITHUB_REF_NAME}" --prerelease
            fi
          else
            gh release create "${GITHUB_REF_NAME}" \
              "dist/${STABLE_DMG}" \
              "dist/${STABLE_ZIP}" \
              "dist/${DMG_NAME}" \
              "dist/${ARCHIVE_NAME}" \
              dist/SHA256SUMS.txt \
              "${EXTRA_ASSETS[@]}" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --verify-tag \
              $PRERELEASE_FLAG
          fi

          echo "Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"

      - name: Job summary
        run: |
          RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          DMG_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${STABLE_DMG}"
          ZIP_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${STABLE_ZIP}"
          {
            echo "## DiskScope ${GITHUB_REF_NAME}"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Релиз | [${GITHUB_REF_NAME}](${RELEASE_URL}) |"
            echo "| DMG | [${STABLE_DMG}](${DMG_URL}) |"
            echo "| ZIP | [${STABLE_ZIP}](${ZIP_URL}) |"
            echo "| Версия | ${VERSION} |"
            echo "| SHA-256 DMG | \`${DMG_SHA256}\` |"
            echo "| SHA-256 ZIP | \`${ZIP_SHA256}\` |"
            echo "| Архитектуры | arm64 + x86_64 |"
            echo "| Тесты | 141 XCTest |"
          } >> "$GITHUB_STEP_SUMMARY"
