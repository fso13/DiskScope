name: Static Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: |
          set -euo pipefail
          swiftlint version

          # Machine-readable report for the artifact and summary.
          swiftlint lint --no-cache --reporter json --output swiftlint.json || true

          # Annotate the diff; warnings are advisory, errors fail the job.
          set +e
          swiftlint lint --no-cache --reporter github-actions-logging
          lint_status=$?
          set -e

          python3 - <<'PY'
          import json
          import os

          try:
              violations = json.load(open('swiftlint.json', encoding='utf-8'))
          except Exception:
              violations = []

          errors = sum(1 for item in violations if item.get('severity') == 'Error')
          warnings = sum(1 for item in violations if item.get('severity') == 'Warning')

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## SwiftLint\n\n')
              summary.write(f'- Errors: **{errors}**\n')
              summary.write(f'- Warnings: **{warnings}**\n')
              summary.write(f'- Files: **{len(set(item.get("file") for item in violations))}**\n')
          PY

          exit "$lint_status"

      - name: Upload SwiftLint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swiftlint-report
          path: swiftlint.json
          if-no-files-found: warn
          retention-days: 30

  compiler:
    name: Compiler
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: swift build --disable-sandbox

  tests:
    name: Tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run XCTest with coverage
        run: swift test --disable-sandbox --enable-code-coverage

      - name: Coverage summary
        if: always()
        run: |
          BIN="$(find .build/out/Products/Debug/DiskScopeKitTests.xctest -type f -perm -111 | head -1)"
          PROFILE=".build/out/Products/Debug/codecov/default.profdata"
          if [ -n "$BIN" ] && [ -f "$PROFILE" ]; then
            xcrun llvm-cov report "$BIN" -instr-profile "$PROFILE"               -ignore-filename-regex='Tests|\.build' > coverage.txt || true
            tail -1 coverage.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.txt
          if-no-files-found: warn
          retention-days: 30

  bundle-smoke:
    name: Bundle smoke
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app bundle without DMG
        env:
          SKIP_DMG: "1"
          UNIVERSAL: "0"
        run: ./build.sh

      - name: Verify bundle
        run: |
          test -x dist/DiskScope.app/Contents/MacOS/DiskScope
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" dist/DiskScope.app/Contents/Info.plist
          test -d dist/DiskScope.app/Contents/Resources/en.lproj
          codesign --verify --deep --strict dist/DiskScope.app
