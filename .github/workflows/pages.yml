name: Documentation

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'docs/**'
      - 'snapshots/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/sync-docs-assets.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build MkDocs site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Sync documentation assets
        run: ./scripts/sync-docs-assets.sh

      - name: Build site
        env:
          MKDOCS_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          MKDOCS_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          MKDOCS_REPO_NAME: ${{ github.event.repository.name }}
          MKDOCS_EDIT_URI: edit/${{ github.ref_name }}/docs/
        run: mkdocs build --strict

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
